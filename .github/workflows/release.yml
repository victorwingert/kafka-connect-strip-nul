name: release

# Tag vX.Y.Z on a commit of main: the jar and its SHA-512 become release assets,
# downloadable without authentication (a Strimzi KafkaConnect build fetches them by URL).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "::error::$GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME points outside main"; exit 1; }
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B verify -Drevision="${GITHUB_REF_NAME#v}"
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="target/kafka-connect-strip-nul-${GITHUB_REF_NAME#v}.jar"
          sha512sum "$jar" | cut -d' ' -f1 > "$jar.sha512"
          gh release create "$GITHUB_REF_NAME" "$jar" "$jar.sha512" --title "$GITHUB_REF_NAME" --notes ""
